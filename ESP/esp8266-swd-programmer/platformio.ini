[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs

lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    LittleFS

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINO_ESP8266_NODEMCU

monitor_speed = 115200
upload_speed = 921600
